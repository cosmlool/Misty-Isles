  <style>
    :root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#e8edf5;background:#0b111c;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(ellipse at top,#1b2a3c 0,#0b111c 55%);color:#e8edf5}button,input{font:inherit}button{cursor:pointer;border:1px solid #46536a;border-radius:9px;background:#26364b;color:#f5f7fb;padding:10px 14px;transition:background .15s,border-color .15s,transform .15s}button:hover{background:#354b65;border-color:#8ba4c7}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#87672e;border-color:#c3a260}.primary:hover{background:#a17b37}.danger{background:#633b43}.muted{color:#aab6c7}.small{font-size:13px}.app{max-width:1600px;margin:0 auto;min-height:100vh;padding:16px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 18px;border:1px solid #35445a;background:#121d2b;border-radius:14px;margin-bottom:14px}.brand{font-weight:800;font-size:20px;letter-spacing:.3px}.resources{display:flex;gap:10px;flex-wrap:wrap}.resource{padding:8px 12px;background:#1c2939;border:1px solid #33445b;border-radius:9px;color:#f0d18a;font-weight:700}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px}.sidebar,.panel{background:#121c2a;border:1px solid #2f4055;border-radius:14px}.sidebar{padding:12px;height:fit-content;position:sticky;top:12px}.nav{display:grid;gap:7px}.nav button{text-align:left;width:100%;background:#182536;border-color:#293b51;padding:12px;font-size:15px}.nav button.active{background:#394b61;border-color:#c09a53;box-shadow:inset 3px 0 #d5b16b}.main{min-width:0}.panel{padding:20px;min-height:650px}.page-title{font-size:26px;margin:0 0 6px}.subtitle{margin:0 0 20px;color:#aab6c7;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.grid.two{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}.card{border:1px solid #304158;border-radius:12px;background:#172435;padding:16px;min-width:0}.card h3{margin:0 0 8px;font-size:17px}.card p{margin:7px 0;color:#b5c1d1;line-height:1.45}.card .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin:16px 0}.stat{padding:12px;background:#1a293a;border-radius:10px;border:1px solid #2d4057}.stat strong{display:block;font-size:21px;margin-top:5px}.bar{height:9px;background:#29374a;border-radius:99px;overflow:hidden;margin:7px 0 13px}.bar span{display:block;height:100%;background:#b85462}.bar.xp span{background:#58a5a0}.list{display:grid;gap:9px}.rowitem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid #2e4057;border-radius:10px;background:#172435}.rowitem .itemtext{min-width:0}.rowitem h3{font-size:15px;margin:0 0 4px}.rowitem p{font-size:13px;color:#aab6c7;margin:0;line-height:1.4}.rowitem .actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.rowitem button{white-space:nowrap}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button.active{background:#87672e;border-color:#d6b776}.notice{position:fixed;right:18px;bottom:18px;z-index:10;max-width:min(460px,calc(100vw - 36px));padding:14px 17px;background:#263b4c;border:1px solid #6c8a9e;border-radius:12px;box-shadow:0 8px 30px #0008;line-height:1.45}.log{white-space:pre-line;line-height:1.65;background:#0d1622;border:1px solid #35445a;padding:16px;border-radius:10px}.formrow{display:flex;gap:8px;flex-wrap:wrap}.formrow input{flex:1;min-width:180px;padding:10px;border:1px solid #45566e;border-radius:9px;background:#0e1825;color:#fff}.racegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.race{padding:20px;text-align:left;min-height:135px}.race .emoji{font-size:28px;display:block;margin-bottom:10px}.footer{color:#74849a;font-size:12px;text-align:center;padding:18px}.status{font-size:12px;color:#a5c4b7}.status.offline{color:#e4a0a0}@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{position:static}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:14px;min-height:500px}.page-title{font-size:23px}.topbar{align-items:flex-start}}@media(max-width:480px){.app{padding:8px}.nav{grid-template-columns:1fr 1fr}.nav button{font-size:13px;padding:10px 8px}.rowitem{align-items:flex-start;flex-direction:column}.rowitem .actions{justify-content:flex-start}.resource{font-size:13px;padding:7px 8px}}
  
    .shop-item-heading{display:flex;align-items:center;gap:12px;min-height:74px}.shop-item-heading>span:last-child{font-size:16px;font-weight:750;line-height:1.3}.item-art-frame{display:inline-grid;place-items:center;flex:0 0 68px;width:68px;height:68px;border:1px solid #9d8b66;border-radius:10px;background:radial-gradient(circle at 35% 25%,#fff5d2,#e4d0a0 55%,#b9a47c);box-shadow:inset 0 1px #fff9,0 2px 5px #0003;overflow:hidden}.item-art{display:block;width:58px;height:58px;object-fit:contain;filter:drop-shadow(0 2px 1px #44352244)}.inventory-item-heading{display:flex;align-items:center;gap:10px}.inventory-item-heading .item-art-frame{width:54px;height:54px;flex-basis:54px}.inventory-item-heading .item-art{width:46px;height:46px}.card:has(.shop-item-heading){padding:14px}.card:has(.shop-item-heading)>p{min-height:42px}.item-art-frame:hover{border-color:#e4c476;box-shadow:0 0 0 2px #e4c47633,inset 0 1px #fff9}

    .asset-feature-banner{position:relative;min-height:168px;margin:12px 0 18px;border:1px solid #b18b4c;border-radius:12px;overflow:hidden;background-position:center 45%;background-size:cover;box-shadow:inset 0 0 0 1px #fff1,0 10px 24px #0005;display:flex;align-items:flex-end}

    .asset-feature-banner>div{position:relative;z-index:1;display:flex;flex-direction:column;gap:5px;padding:18px 22px;max-width:72%}
    .asset-feature-banner span{font-size:10px;letter-spacing:.18em;color:#f0c77d;font-weight:800}
    .asset-feature-banner strong{font-family:Georgia,serif;font-size:clamp(19px,2vw,27px);color:#fff0ce;text-shadow:0 2px 8px #000;line-height:1.15}
    .asset-feature-banner small{font-size:12px;color:#d7e2e5}
    .equipment-feature{min-height:150px;background-position:center 36%}
    .creature-feature{min-height:180px;background-position:center 57%}
    @media(max-width:700px){.asset-feature-banner>div{max-width:100%;padding:14px}.asset-feature-banner{min-height:140px}}

    /* Stage 5 — item inspection, consistent rarity language and tactile UI polish */
    .item-art-frame{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;position:relative;flex:0 0 auto;outline:none;border-radius:10px;transition:transform .16s,filter .16s;cursor:help}
    .item-art-frame:hover,.item-art-frame:focus-visible{transform:translateY(-2px);filter:drop-shadow(0 0 8px #e0b96866)}
    .item-art-frame:focus-visible{outline:2px solid #e7c879;outline-offset:3px}
    .item-art{object-fit:contain;image-rendering:auto}
    .item-tooltip{position:fixed;z-index:99999;width:min(310px,calc(100vw - 28px));padding:13px 14px;border:1px solid #c9a45e;border-radius:13px;background:linear-gradient(145deg,#172d3a 0%,#0b1724 85%);box-shadow:0 14px 42px #000b,inset 0 0 0 1px #e8c87918;color:#edf3f4;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .1s,transform .1s;visibility:hidden}
    .item-tooltip.visible{opacity:1;transform:translateY(0);visibility:visible}
    .item-tooltip-head{display:flex;align-items:center;gap:11px;padding-bottom:10px;border-bottom:1px solid #536a70}
    .item-tooltip-head img{width:54px;height:54px;object-fit:contain;flex:0 0 54px;padding:4px;border:1px solid #718b8a;border-radius:10px;background:#091723}
    .item-tooltip-head strong{display:block;font-size:15px;line-height:1.25;color:#ffe5a5}
    .item-tooltip-head span{display:block;margin-top:5px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#a9c7cb}
    .item-tooltip-desc{font-size:12px;line-height:1.45;color:#d1dcdf;margin:10px 0!important}
    .item-tooltip-stats{display:grid;gap:5px;margin:8px 0;font-size:12px;color:#e9d39b}
    .item-tooltip-foot{display:flex;justify-content:space-between;gap:10px;padding-top:9px;border-top:1px solid #40575f;font-size:12px;color:#bdcbd0}
    .item-tooltip-foot b{color:#f7d487}.item-tooltip small{display:block;margin-top:7px;color:#728d95;font-size:10px;overflow-wrap:anywhere}
    .rarity-обычный{color:#c6d2d8!important}.rarity-редкий{color:#6dd5ee!important}.rarity-эпический{color:#c8a0ff!important}.rarity-легендарный{color:#ffca73!important}
    .inventory-item-heading{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.inventory-item-heading .item-art-frame{width:42px;height:42px;padding:3px;background:#0b1724;border:1px solid #4c6571}.inventory-item-heading .item-art{width:100%;height:100%}
    .rowitem .item-art-frame{width:38px;height:38px;padding:3px;background:#0b1724;border:1px solid #405967}.rowitem .item-art{width:100%;height:100%}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #e8c879;outline-offset:2px}
    @media(max-width:640px){.item-tooltip{width:min(280px,calc(100vw - 24px));padding:11px}.item-tooltip-head img{width:44px;height:44px;flex-basis:44px}}

  
/* Character page: compact MMORPG profile and in-page dresser */
.character-game-layout{display:grid;grid-template-columns:72px minmax(250px,.92fr) minmax(300px,1.08fr);gap:12px;align-items:stretch;margin:0 0 18px}
.character-left-gear{border:1px solid #8b7048;border-radius:10px;padding:8px;background:linear-gradient(180deg,#3a2b20,#241c18);display:flex;flex-direction:column;gap:8px}
.gear-side-buttons{display:flex;flex-direction:column;gap:8px}
.gear-slot-button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:66px;padding:6px 3px;border:1px solid #9b7b4b;border-radius:6px;color:#f3e1bd;background:linear-gradient(145deg,#765333,#3b2b20);cursor:pointer}
.gear-slot-button span{font-size:25px;line-height:1.1}.gear-slot-button small{font-size:10px}.gear-slot-button:hover,.gear-slot-button.filled{border-color:#e3c27c;background:linear-gradient(145deg,#99703b,#594027)}
.character-center{min-width:0;display:flex;flex-direction:column;gap:10px}.character-center .character-portrait-panel{min-height:310px;border:3px solid #a9844f;border-radius:5px;box-shadow:inset 0 0 0 2px #39291e,0 3px 8px #0005}.character-center .character-portrait-info{padding:12px}.character-center .character-vitals{gap:8px}.character-center .vital-card{padding:10px 12px;border-color:#9c7d4c;border-radius:5px;background:#dfcfad;color:#493321}.character-center .vital-label{margin-bottom:7px;font-size:12px;color:#493321}.character-center .vital-label strong{font-size:13px;color:#493321}.character-center .vital-card .bar{height:12px;background:#8b7b61}.character-center .vital-card .bar span{background:linear-gradient(90deg,#427b37,#78b94b)}.character-center .vital-card .bar.xp span{background:linear-gradient(90deg,#267e9a,#68c5da)}
.character-dresser{min-width:0;padding:12px!important;border:1px solid #9b7c4e!important;border-radius:7px!important;background:linear-gradient(180deg,#e7d8b8,#d8c5a0)!important;color:#4b3625!important;box-shadow:inset 0 0 0 2px #f0e4c8}.character-dresser h3,.character-dresser strong{color:#4b3625}.character-dresser .section-heading{margin-bottom:10px}.character-dresser .section-heading p{color:#796247}.character-dresser .section-heading button{font-size:12px;padding:7px 9px;color:#4b3625;background:#f0e4c8;border:1px solid #b49a6c;border-radius:4px}
.equipped-summary{display:grid;grid-template-columns:1fr;gap:5px;margin-bottom:10px}.equipped-item{display:flex;align-items:center;gap:9px;padding:7px;border:1px solid #c2aa7d;background:#f0e4c8;border-radius:5px}.equipped-item>span{display:grid;place-items:center;width:34px;height:34px;flex:0 0 34px;background:#c7b18a;border:1px solid #a28a60;border-radius:4px;font-size:20px}.equipped-item div{min-width:0;display:flex;flex-direction:column;gap:2px}.equipped-item small{font-size:10px;color:#7a6044}.equipped-item strong{font-size:12px;overflow-wrap:anywhere}
.dress-tabs{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0;padding-bottom:8px;border-bottom:1px solid #c2aa7d}.dress-tabs button{padding:7px 9px;border:1px solid #b49a6c;border-radius:4px;background:#e0cba5;color:#5a402a;font-size:11px;cursor:pointer}.dress-tabs button.active,.dress-tabs button:hover{background:#795536;color:#fff0d0;border-color:#573a25}.dress-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-height:340px;overflow:auto;padding:2px}.dress-item{min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 5px;border:1px solid #b39a6c;border-radius:5px;background:linear-gradient(180deg,#f2e5c7,#e2cfaa);text-align:center}.dress-item[hidden]{display:none}.dress-item.is-equipped{border-color:#6b9953;box-shadow:inset 0 0 0 1px #8fb86d}.dress-item-icon{display:grid;place-items:center;width:46px;height:46px;border:1px solid #b8a078;border-radius:4px;background:#d2bd92;font-size:25px}.dress-item strong{font-size:11px;line-height:1.25;overflow-wrap:anywhere}.dress-item small{font-size:10px;color:#7a6044;line-height:1.3}.dress-item button{font-size:11px;padding:6px 8px;min-height:30px;background:#795536;border:1px solid #573a25;color:#fff0d0;border-radius:4px}.equipped-mark{font-size:10px;color:#37672c;font-weight:700}.dress-empty{grid-column:1/-1;padding:20px 12px;text-align:center;font-size:12px;color:#7a6044;border:1px dashed #b49a6c;border-radius:5px}
.character-summary{margin-bottom:14px}.character-statistics{padding:18px!important}.character-stat-list{display:flex;flex-direction:column;gap:0}.character-stat-list>div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid #344657;font-size:13px}.character-stat-list>div strong{text-align:right;color:#f0d9a7}.character-statistics .character-bottom-links{grid-template-columns:1fr;margin-top:12px}.character-statistics .character-bottom-links button{min-height:36px}
@media(max-width:1000px){.character-game-layout{grid-template-columns:58px minmax(220px,.9fr) minmax(260px,1.1fr)}.gear-slot-button{min-height:58px}.dress-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.character-game-layout{grid-template-columns:56px minmax(0,1fr)}.character-center{grid-column:2}.character-dresser{grid-column:1/-1}.character-left-gear{grid-row:1;grid-column:1}.character-center .character-portrait-panel{min-height:300px}.equipped-summary{grid-template-columns:repeat(3,minmax(0,1fr))}.equipped-item{align-items:flex-start;flex-direction:column}.dress-grid{grid-template-columns:repeat(3,minmax(0,1fr));max-height:none}}
@media(max-width:480px){.character-game-layout{grid-template-columns:48px minmax(0,1fr);gap:7px}.gear-slot-button{min-height:52px}.gear-slot-button span{font-size:21px}.gear-slot-button small{font-size:9px}.character-center .character-portrait-panel{min-height:250px}.equipped-summary{grid-template-columns:1fr}.equipped-item{flex-direction:row;align-items:center}.dress-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Stage 21 — craft, homestead and sanctuary polish */
.craft-summary,.home-overview-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0 20px}
.craft-summary>div,.home-overview-stats>div{background:var(--panel,rgba(255,255,255,.045));border:1px solid var(--line,rgba(255,255,255,.1));border-radius:13px;padding:13px;min-width:0}
.craft-summary small,.home-overview-stats small{display:block;color:var(--muted,#9ba6b7);font-size:12px;margin-bottom:5px}.craft-summary strong,.home-overview-stats b{display:block;font-size:20px;overflow-wrap:anywhere}
.craft-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(270px,.8fr);gap:16px;align-items:start}.craft-recipes-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.craft-recipe-card{min-width:0}.craft-recipe-top{display:flex;gap:11px;align-items:flex-start}.craft-recipe-icon{display:grid;place-items:center;width:42px;height:42px;flex:0 0 42px;border-radius:12px;background:rgba(190,150,90,.13);font-size:22px}.craft-recipe-top h3{margin:0 0 4px}.craft-recipe-top p{margin:0;color:var(--muted,#9ba6b7);font-size:13px}.craft-recipe-reward{margin:13px 0;padding:9px 11px;border-radius:9px;background:rgba(130,160,120,.09)}.craft-materials{display:grid;gap:5px}.material-line{display:flex;justify-content:space-between;gap:8px;font-size:13px}.material-ok b{color:#8bc49a}.material-missing b{color:#e6a17f}.craft-recipe-meta{display:flex;justify-content:space-between;color:var(--muted,#9ba6b7);font-size:12px;margin:12px 0}.craft-queue-panel{position:sticky;top:12px}.craft-job{padding:12px 0;border-bottom:1px solid var(--line,rgba(255,255,255,.1))}.craft-job-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.craft-job-head small{display:block;color:var(--muted,#9ba6b7);margin-top:4px}.craft-progress,.home-level-track{display:flex;gap:4px;height:7px;margin:10px 0;background:rgba(255,255,255,.06);border-radius:9px;overflow:hidden}.craft-progress span{display:block;background:linear-gradient(90deg,#789c83,#b7c98b);border-radius:9px}.craft-empty{padding:18px;border:1px dashed var(--line,rgba(255,255,255,.18));border-radius:12px;color:var(--muted,#9ba6b7);font-size:13px}.craft-capacity{font-size:12px;color:var(--muted,#9ba6b7)}
.home-overview{border:1px solid var(--line,rgba(255,255,255,.1));border-radius:16px;overflow:hidden;margin:12px 0 20px;background:linear-gradient(120deg,rgba(63,91,77,.38),rgba(44,55,65,.55))}.home-art{min-height:150px;display:flex;align-items:center;gap:20px;padding:24px;background:radial-gradient(ellipse at 15% 100%,rgba(161,177,124,.2),transparent 55%)}.home-art-mark{width:78px;height:78px;display:grid;place-items:center;border-radius:22px;background:rgba(225,211,166,.12);font-size:54px;color:#d8c99d}.home-art span,.sanctuary-hero span{font-size:10px;letter-spacing:.18em;color:#c7b98d}.home-art h2,.sanctuary-hero h2{margin:5px 0}.home-art p,.sanctuary-hero p{margin:0;color:var(--muted,#aab3bd)}.home-overview-stats{padding:0 14px 14px;margin:0}.home-overview-stats>div{background:rgba(0,0,0,.12)}.home-buildings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.home-building-card{min-width:0}.home-building-head{display:flex;align-items:center;gap:12px}.home-building-head>span{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:rgba(190,150,90,.13);font-size:24px}.home-building-head h3{margin:0}.home-building-head small{color:var(--muted,#9ba6b7)}.home-level-track i{display:block;flex:1;background:rgba(255,255,255,.08);border-radius:8px}.home-level-track i.filled{background:#91a77d}.home-benefit{padding:10px;border-radius:9px;background:rgba(130,160,120,.08);font-size:13px;margin:10px 0}.home-building-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}

<style id="misty-layout-v3-structural-fix">
/* Structural layout fix v3: sidebar, content and widgets share one grid. */
html, body { width:100%; max-width:100%; overflow-x:hidden; }
body { margin:0; }
#app { width:100%; min-width:0; }
.app { width:100%; max-width:1760px; margin-inline:auto; padding:14px 18px 24px; }
.topbar, .quick-nav { width:100%; }
.layout {
  display:grid !important;
  grid-template-columns: minmax(205px, 248px) minmax(0, 1fr) minmax(205px, 228px) !important;
  align-items:start !important;
  gap:14px !important;
  width:100% !important;
  max-width:100% !important;
  margin:0 !important;
  padding:0 !important;
  min-width:0 !important;
}
.layout > .sidebar { grid-column:1; grid-row:1; width:100%; min-width:0; margin:0 !important; position:sticky; top:12px; }
.layout > .main { grid-column:2; grid-row:1; width:100%; min-width:0 !important; max-width:100%; margin:0 !important; }
.layout > .right-widgets {
  grid-column:3; grid-row:1; position:static !important; inset:auto !important;
  width:100% !important; min-width:0 !important; max-width:100% !important;
  max-height:calc(100vh - 24px) !important; margin:0 !important; padding:0 !important;
  display:flex !important; flex-direction:column !important; align-items:stretch !important;
  gap:12px !important; overflow-y:auto !important; overflow-x:hidden !important;
  z-index:1 !important; box-sizing:border-box !important;
}

.layout > .right-widgets .reminders-panel {
  width:100% !important; min-width:0 !important; max-width:100% !important;
  position:relative !important; inset:auto !important; margin:0 !important;
  flex:0 0 auto !important; box-sizing:border-box !important;
  border:1px solid #35475c !important; border-radius:8px !important;
