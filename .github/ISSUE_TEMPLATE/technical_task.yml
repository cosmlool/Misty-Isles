name: Technical task
description: Track an engineering, testing, or infrastructure task
title: "[TECH] "
labels: ["technical"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Цель
      description: Какую техническую проблему или риск нужно устранить?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Область работ
      description: Какие системы и файлы предположительно затронуты?
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Критерии готовности
      description: Какие проверки и результаты подтвердят завершение?
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Ограничения
      options:
        - label: Не менять игровой баланс без отдельного согласования.
        - label: Не менять существующие сохранения без безопасной миграции.
        - label: Обновить документацию и контрольную точку.
