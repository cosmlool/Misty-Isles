name: Misty Isles Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: misty-isles-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-and-project-audit:
    name: Data, docs and project structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit project data and required files
        run: node tools/qa-audit.mjs

  client-build:
    name: Client TypeScript and Vite build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install locked client dependencies
        run: npm ci --no-audit --no-fund
        working-directory: client
      - name: Verify assets, manifest and production build
        run: npm run verify:project
        working-directory: client

  server-build:
    name: Server TypeScript build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked server dependencies
        run: npm ci --no-audit --no-fund
        working-directory: server
      - name: Test server transaction recovery
        run: npm test
        working-directory: server
      - name: Compile server
        run: npm run build
        working-directory: server

  browser-e2e:
    name: Playwright browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked server dependencies
        run: npm ci --no-audit --no-fund
        working-directory: server
      - name: Install locked client dependencies
        run: npm ci --no-audit --no-fund
        working-directory: client
      - name: Install Playwright test dependency
        run: npm install --no-audit --no-fund
        working-directory: e2e
      - name: Install Google Chrome for Playwright
        run: npx playwright install --with-deps chrome
        working-directory: e2e
      - name: Run isolated browser scenarios
        run: npm test
        working-directory: e2e
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misty-isles-playwright-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
